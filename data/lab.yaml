intro: "Five machines under a desk running what most people rent from Google: photos, files, documents, calendars, media, and the network itself. In daily use since 2023, with no support contract and nobody to escalate to. When it breaks, I find out why."

items:
  - name: Network segmentation
    what: "A 5-VLAN network on OPNsense: per-VLAN firewall policy, 802.1Q trunking on a managed switch, isolated tenant and IoT traffic, and split-horizon DNS through Pi-hole and Cloudflare. Real networking on real hardware, from subnetting decisions down to packet-level troubleshooting."
    stack: [OPNsense, VLANs, 802.1Q, Pi-hole, Cloudflare]

  - name: Compute & platform
    what: "A two-node Proxmox cluster and a 3-node k3s cluster running 40+ services behind Traefik with automatic TLS. Every workload carries CPU and memory requests and limits sized from live usage metrics, and cloud-init templates provision a fully monitored VM in under five minutes."
    stack: [Proxmox, k3s, Docker, Traefik, cloud-init, TrueNAS]

  - name: Observability & SIEM
    what: "Every host, container, and firewall log flows into one pipeline: Prometheus for metrics, Loki for logs via Promtail, Grafana for dashboards and alerting. A dedicated Wazuh SIEM adds agent-based detection on top, with my OPNsense firewall feeding it over agentless syslog and custom rules I wrote to flag port scans (mapped to MITRE ATT&CK), plus CrowdSec for behavioural detection. The same analysis I practise on Blue Team Labs Online (#24 in Australia), applied to live infrastructure."
    stack: [Wazuh, CrowdSec, OPNsense, Prometheus, Grafana, Loki]

  - name: Identity & access
    what: "Authentik SSO with MFA enforced on every service, SSH keys only, and zero open inbound ports. Remote access goes through zero-trust Twingate and a single Cloudflare Tunnel."
    stack: [Authentik, MFA, Twingate, cert-manager]

  - name: Storage & databases
    what: "A mirrored ZFS pool serves NFS to the whole lab, with one deliberate exception: a dozen PostgreSQL instances stay on local disk for integrity, with automated nightly dumps for the critical ones. Redis, Meilisearch, and Elasticsearch round out the data layer."
    stack: [ZFS, NFS, PostgreSQL, Redis, Meilisearch]
